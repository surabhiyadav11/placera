# ===================================================================
# PLACERA: College Placement Management System Configuration
# ===================================================================

# Application & Server
spring.application.name=placera
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
# Uses environment variables with fallback defaults for local development
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placera_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration (for Student Resumes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Placera Custom Properties
placera.upload.dir=${UPLOAD_DIR:uploads/resumes}
placera.admin.default-email=${ADMIN_EMAIL:admin@placera.edu}
placera.admin.default-password=${ADMIN_PASSWORD:Admin@1234}
