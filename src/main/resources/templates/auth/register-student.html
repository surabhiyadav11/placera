<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: htmlHead('Student Registration')}">
    <title>Student Registration - Placera</title>
</head>
<body class="auth-page">

<div class="auth-wrapper" style="max-width: 680px; margin: 2rem auto;">
    <div class="auth-card" style="padding: 2.5rem;">
        <!-- Brand Header -->
        <div class="auth-header text-center">
            <a th:href="@{/}" class="brand-link" style="justify-content: center; margin-bottom: 0.75rem;">
                <div class="brand-badge">P</div>
                <div style="text-align: left;">
                    <div class="brand-title">Placera</div>
                    <div style="font-size: 0.75rem; color: #64748b;">Placement Portal</div>
                </div>
            </a>
            <h2 class="auth-title">Candidate Registration</h2>
            <p class="auth-subtitle">Create your student profile to access campus recruitment drives and apply for jobs.</p>
        </div>

        <!-- Global Flash Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 1.5rem;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px; flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span th:text="${errorMessage}">Registration error occurred.</span>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register/student}" th:object="${studentDto}" method="POST" class="auth-form" id="studentRegisterForm">
            <!-- Full Name & Email -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="e.g. Surabhi Yadav" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">College Email <span class="text-danger">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="e.g. surabhi@college.edu" required autocomplete="username">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
            </div>

            <!-- Password & Roll Number -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="password" class="form-label">Account Password <span class="text-danger">*</span></label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="Min. 6 characters" required autocomplete="new-password">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="form-group">
                    <label for="rollNumber" class="form-label">Roll / University ID <span class="text-danger">*</span></label>
                    <input type="text" id="rollNumber" th:field="*{rollNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('rollNumber')} ? 'is-invalid' : ''"
                           placeholder="e.g. 22CSE045" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></div>
                </div>
            </div>

            <!-- Branch, CGPA, & Graduation Year -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="branch" class="form-label">Department / Branch <span class="text-danger">*</span></label>
                    <select id="branch" th:field="*{branch}" class="form-control"
                            th:classappend="${#fields.hasErrors('branch')} ? 'is-invalid' : ''" required>
                        <option value="">Select Branch</option>
                        <option value="Computer Science and Engineering">Computer Science (CSE)</option>
                        <option value="Information Technology">Information Technology (IT)</option>
                        <option value="Electronics and Communication">Electronics &amp; Comm. (ECE)</option>
                        <option value="Electrical and Electronics">Electrical &amp; Electronics (EEE)</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></div>
                </div>

                <div class="form-group">
                    <label for="cgpa" class="form-label">Current CGPA (out of 10) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" min="0" max="10" id="cgpa" th:field="*{cgpa}" class="form-control"
                           th:classappend="${#fields.hasErrors('cgpa')} ? 'is-invalid' : ''"
                           placeholder="e.g. 8.75" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('cgpa')}" th:errors="*{cgpa}"></div>
                </div>

                <div class="form-group">
                    <label for="graduationYear" class="form-label">Graduation Year <span class="text-danger">*</span></label>
                    <select id="graduationYear" th:field="*{graduationYear}" class="form-control"
                            th:classappend="${#fields.hasErrors('graduationYear')} ? 'is-invalid' : ''" required>
                        <option value="">Select Year</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('graduationYear')}" th:errors="*{graduationYear}"></div>
                </div>
            </div>

            <!-- Phone & Skills -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="phone" class="form-label">Contact Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                           placeholder="e.g. +91 98765 43210">
                </div>

                <div class="form-group">
                    <label for="skills" class="form-label">Technical Skills (Comma separated)</label>
                    <input type="text" id="skills" th:field="*{skills}" class="form-control"
                           placeholder="e.g. Java, OOP, Spring Boot, MySQL, React">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-group" style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitStudentRegBtn">
                    Complete Student Registration &rarr;
                </button>
            </div>
        </form>

        <!-- Footer Links -->
        <div class="auth-footer text-center" style="margin-top: 1.5rem; font-size: 0.875rem;">
            <p style="color: #64748b; margin-bottom: 0.5rem;">
                Already registered? <a th:href="@{/login}" class="text-primary" style="font-weight: 600;">Sign in to your account</a>
            </p>
            <div style="margin-top: 0.5rem;">
                <a th:href="@{/register}" style="color: #94a3b8; text-decoration: none; font-size: 0.8125rem;">&larr; Switch account type</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
